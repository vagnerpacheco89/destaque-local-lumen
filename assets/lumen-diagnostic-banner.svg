<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 480" role="img" aria-labelledby="title desc">
  <title id="title">Nem todo problema elétrico pede troca imediata</title>
  <desc id="desc">Banner editorial sobre diagnóstico elétrico cuidadoso, explicação clara e orientação do que realmente precisa ser feito.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbf8ef"/>
      <stop offset="0.74" stop-color="#f7f3e9"/>
      <stop offset="1" stop-color="#eee8dc"/>
    </linearGradient>
    <radialGradient id="light" cx="0.58" cy="0.06" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity=".96"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" x2="1">
      <stop offset="0" stop-color="#f5f0e5"/>
      <stop offset="1" stop-color="#e7dfd0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#123e2f" flood-opacity=".12"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="1500" height="480" fill="url(#bg)"/>
  <rect width="1500" height="480" fill="url(#light)"/>

  <!-- editorial circuits -->
  <g fill="none" stroke="#123e2f" stroke-width="2" stroke-linecap="round">
    <path d="M42 0v126" opacity=".75"/>
    <path d="M930 0v68c0 24 12 36 36 36h114c26 0 38 13 38 39v30" opacity=".8"/>
    <path d="M1122 342h-110c-20 0-30 10-30 30v24H744" opacity=".8"/>
  </g>
  <g fill="#f8f3e9" stroke="#ffc72b" stroke-width="3">
    <circle cx="42" cy="96" r="6"/>
    <circle cx="930" cy="68" r="6"/>
    <circle cx="1118" cy="173" r="6"/>
    <circle cx="982" cy="372" r="6"/>
  </g>
  <g fill="none" stroke="#ffc72b" stroke-width="2">
    <path d="M0 430h310c22 0 32 10 44 25 10 13 20 17 41 17h190"/>
    <path d="M918 418h-108c-18 0-27-9-27-27v-24"/>
  </g>
  <g fill="#f8f3e9" stroke="#123e2f" stroke-width="3"><circle cx="585" cy="472" r="6"/></g>

  <!-- headline -->
  <g fill="#103d2c">
    <text x="92" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="-2">Nem todo problema</text>
    <text x="92" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="-2">elétrico pede troca imediata.</text>
  </g>
  <rect x="404" y="179" width="354" height="11" rx="2" fill="#ffc72b" opacity=".9"/>

  <text x="94" y="224" fill="#385448" font-family="Arial, Helvetica, sans-serif" font-size="23">Antes de mexer na instalação, o mais importante</text>
  <text x="94" y="256" fill="#385448" font-family="Arial, Helvetica, sans-serif" font-size="23">é identificar a causa com segurança.</text>

  <!-- value points -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#173f30">
    <g transform="translate(100 294)">
      <circle cx="26" cy="26" r="26" fill="#f0eee7"/>
      <circle cx="23" cy="22" r="12" fill="none" stroke="#0f563c" stroke-width="4"/>
      <path d="M14 34 6 44" stroke="#ffc72b" stroke-width="6" stroke-linecap="round"/>
      <text x="70" y="21" font-size="19" font-weight="700">Diagnóstico</text><text x="70" y="44" font-size="19">cuidadoso</text>
    </g>
    <line x1="306" y1="296" x2="306" y2="344" stroke="#cfcfc8" stroke-width="2"/>
    <g transform="translate(346 294)">
      <circle cx="26" cy="26" r="26" fill="#f0eee7"/>
      <rect x="17" y="12" width="21" height="29" rx="2" fill="none" stroke="#0f563c" stroke-width="3"/>
      <path d="M22 20h11M22 26h11M22 32h7" stroke="#ffc72b" stroke-width="3"/>
      <text x="72" y="21" font-size="19" font-weight="700">Explicação</text><text x="72" y="44" font-size="19">clara</text>
    </g>
    <line x1="555" y1="296" x2="555" y2="344" stroke="#cfcfc8" stroke-width="2"/>
    <g transform="translate(596 294)">
      <circle cx="26" cy="26" r="26" fill="#f0eee7"/>
      <path d="M26 9 41 15v13c0 11-6 19-15 24-9-5-15-13-15-24V15z" fill="none" stroke="#0f563c" stroke-width="3"/>
      <path d="m19 29 6 6 10-13" fill="none" stroke="#ffc72b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="72" y="21" font-size="19" font-weight="700">Orientação do que</text><text x="72" y="44" font-size="19">realmente precisa ser feito</text>
    </g>
  </g>

  <rect x="95" y="374" width="62" height="5" rx="3" fill="#ffc72b"/>
  <text x="94" y="424" fill="#103d2c" font-family="Georgia, 'Times New Roman', serif" font-size="33">Entender a causa vem antes da solução.</text>
  <line x1="94" y1="439" x2="565" y2="439" stroke="#b9c1bb" stroke-width="1.5"/>

  <!-- lower green brand shape -->
  <path d="M0 401h52c22 0 34 13 50 31l34 37c7 8 16 11 29 11H0z" fill="#174d39"/>

  <!-- right-side architectural scene -->
  <g transform="translate(1150 0)">
    <rect width="350" height="480" fill="url(#wall)"/>
    <path d="M0 0h350v480H120c24-54 41-102 50-145 15-72 1-143-30-191C110 94 70 55 0 32z" fill="#fff" opacity=".40"/>
    <g opacity=".45" filter="url(#blur)" fill="#35583f">
      <ellipse cx="297" cy="30" rx="34" ry="70" transform="rotate(35 297 30)"/>
      <ellipse cx="327" cy="96" rx="28" ry="62" transform="rotate(-20 327 96)"/>
      <ellipse cx="280" cy="125" rx="23" ry="55" transform="rotate(38 280 125)"/>
    </g>
    <g filter="url(#shadow)" transform="translate(115 132)">
      <rect x="0" y="0" width="104" height="180" rx="6" fill="#f9f7f0"/>
      <rect x="22" y="40" width="60" height="96" rx="5" fill="#ebe7dc" stroke="#8f8a7f" stroke-width="2"/>
      <circle cx="41" cy="87" r="6" fill="#171b18"/><circle cx="63" cy="87" r="6" fill="#171b18"/>
      <rect x="49" y="98" width="6" height="14" rx="3" fill="#171b18"/>
    </g>
    <path d="M0 366h350v114H0c28-25 59-46 92-62 41-20 84-33 127-40 42-7 86-9 131-12z" fill="#d7d0c3" opacity=".55"/>
  </g>

  <!-- ground symbol -->
  <g transform="translate(986 36)" fill="none" stroke="#173f30" stroke-width="3" stroke-linecap="round">
    <path d="M14 0v26M1 26h26M5 34h18M9 42h10"/>
  </g>

  <!-- bolt symbol -->
  <g transform="translate(900 372)">
    <circle cx="26" cy="26" r="25" fill="#fbf8ef" stroke="#173f30" stroke-width="2"/>
    <path d="m28 8-12 21h9l-3 15 14-23h-9z" fill="#173f30"/>
  </g>
</svg>
