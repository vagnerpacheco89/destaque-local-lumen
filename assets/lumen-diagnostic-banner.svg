<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 544" role="img" aria-labelledby="title desc">
  <title id="title">Nem todo problema elétrico pede troca imediata</title>
  <desc id="desc">Banner editorial sobre diagnóstico elétrico cuidadoso, explicação clara e orientação do que realmente precisa ser feito.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbf8ef"/>
      <stop offset="0.72" stop-color="#f7f3e9"/>
      <stop offset="1" stop-color="#eee8dc"/>
    </linearGradient>
    <radialGradient id="light" cx="0.62" cy="0.08" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" x2="1">
      <stop offset="0" stop-color="#f5f0e5"/>
      <stop offset="1" stop-color="#e7dfd0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#123e2f" flood-opacity="0.12"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="1200" height="544" fill="url(#bg)"/>
  <rect width="1200" height="544" fill="url(#light)"/>

  <!-- editorial circuits -->
  <g fill="none" stroke="#123e2f" stroke-width="2" stroke-linecap="round">
    <path d="M36 0v144" opacity=".75"/>
    <path d="M792 0v78c0 25 12 38 36 38h72c26 0 38 13 38 39v42" opacity=".8"/>
    <path d="M948 362h-86c-20 0-30 10-30 30v37H606" opacity=".8"/>
  </g>
  <g fill="#f8f3e9" stroke="#ffc72b" stroke-width="3">
    <circle cx="36" cy="105" r="6"/><circle cx="792" cy="78" r="6"/><circle cx="938" cy="197" r="6"/><circle cx="832" cy="392" r="6"/>
  </g>
  <g fill="none" stroke="#ffc72b" stroke-width="2">
    <path d="M0 468h280c22 0 32 10 44 25 10 13 20 17 41 17h136"/>
    <path d="M778 463h-93c-18 0-27-9-27-27v-34"/>
  </g>
  <g fill="#f8f3e9" stroke="#123e2f" stroke-width="3"><circle cx="501" cy="510" r="6"/></g>

  <!-- headline -->
  <g fill="#103d2c">
    <text x="92" y="116" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" letter-spacing="-2">Nem todo problema</text>
    <text x="92" y="183" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" letter-spacing="-2">elétrico pede troca imediata.</text>
  </g>
  <rect x="403" y="192" width="354" height="12" rx="2" fill="#ffc72b" opacity=".9"/>

  <text x="94" y="242" fill="#385448" font-family="Arial, Helvetica, sans-serif" font-size="24">Antes de mexer na instalação, o mais importante</text>
  <text x="94" y="276" fill="#385448" font-family="Arial, Helvetica, sans-serif" font-size="24">é identificar a causa com segurança.</text>

  <!-- value points -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#173f30">
    <g transform="translate(100 326)">
      <circle cx="28" cy="28" r="28" fill="#f0eee7"/>
      <circle cx="25" cy="24" r="13" fill="none" stroke="#0f563c" stroke-width="4"/>
      <path d="M15 36 6 47" stroke="#ffc72b" stroke-width="6" stroke-linecap="round"/>
      <text x="74" y="22" font-size="20" font-weight="700">Diagnóstico</text><text x="74" y="46" font-size="20">cuidadoso</text>
    </g>
    <line x1="304" y1="329" x2="304" y2="379" stroke="#cfcfc8" stroke-width="2"/>
    <g transform="translate(342 326)">
      <circle cx="28" cy="28" r="28" fill="#f0eee7"/>
      <rect x="18" y="13" width="22" height="31" rx="2" fill="none" stroke="#0f563c" stroke-width="3"/>
      <path d="M23 21h12M23 27h12M23 33h8" stroke="#ffc72b" stroke-width="3"/>
      <text x="76" y="22" font-size="20" font-weight="700">Explicação</text><text x="76" y="46" font-size="20">clara</text>
    </g>
    <line x1="551" y1="329" x2="551" y2="379" stroke="#cfcfc8" stroke-width="2"/>
    <g transform="translate(592 326)">
      <circle cx="28" cy="28" r="28" fill="#f0eee7"/>
      <path d="M28 10 44 16v14c0 12-7 20-16 25-9-5-16-13-16-25V16z" fill="none" stroke="#0f563c" stroke-width="3"/>
      <path d="m20 31 6 6 11-14" fill="none" stroke="#ffc72b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="22" font-size="20" font-weight="700">Orientação do que</text><text x="76" y="46" font-size="20">realmente precisa ser feito</text>
    </g>
  </g>

  <rect x="95" y="409" width="62" height="5" rx="3" fill="#ffc72b"/>
  <text x="94" y="467" fill="#103d2c" font-family="Georgia, 'Times New Roman', serif" font-size="34">Entender a causa vem antes da solução.</text>
  <line x1="94" y1="482" x2="552" y2="482" stroke="#b9c1bb" stroke-width="1.5"/>

  <!-- lower green brand shape -->
  <path d="M0 432h45c22 0 32 13 48 31l40 43c12 13 26 20 44 20h103c17 0 28 6 39 18H0z" fill="#174d39"/>

  <!-- right-side architectural scene -->
  <g transform="translate(900 0)">
    <rect width="300" height="544" fill="url(#wall)"/>
    <path d="M0 0h300v544H94c27-61 46-115 56-163 17-80 1-160-33-214C83 112 43 68 0 44z" fill="#fff" opacity=".38"/>
    <g opacity=".45" filter="url(#blur)" fill="#35583f">
      <ellipse cx="254" cy="34" rx="34" ry="70" transform="rotate(35 254 34)"/>
      <ellipse cx="286" cy="104" rx="28" ry="62" transform="rotate(-20 286 104)"/>
      <ellipse cx="242" cy="132" rx="23" ry="55" transform="rotate(38 242 132)"/>
    </g>
    <g filter="url(#shadow)" transform="translate(103 158)">
      <rect x="0" y="0" width="104" height="180" rx="6" fill="#f9f7f0"/>
      <rect x="22" y="40" width="60" height="96" rx="5" fill="#ebe7dc" stroke="#8f8a7f" stroke-width="2"/>
      <circle cx="41" cy="87" r="6" fill="#171b18"/><circle cx="63" cy="87" r="6" fill="#171b18"/>
      <rect x="49" y="98" width="6" height="14" rx="3" fill="#171b18"/>
    </g>
    <path d="M0 402h300v142H0c24-31 50-58 77-77 34-24 70-40 106-48 37-9 76-12 117-17z" fill="#d7d0c3" opacity=".55"/>
  </g>

  <!-- ground symbol -->
  <g transform="translate(828 42)" fill="none" stroke="#173f30" stroke-width="3" stroke-linecap="round">
    <path d="M14 0v26M1 26h26M5 34h18M9 42h10"/>
  </g>

  <!-- bolt symbol -->
  <g transform="translate(742 418)">
    <circle cx="26" cy="26" r="25" fill="#fbf8ef" stroke="#173f30" stroke-width="2"/>
    <path d="m28 8-12 21h9l-3 15 14-23h-9z" fill="#173f30"/>
  </g>
</svg>