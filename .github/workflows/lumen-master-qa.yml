name: LUMEN MASTER post-consolidation QA

on:
  push:
    branches: [main, release/lumen-master-v1.0]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'lumen-theme.css'
      - 'lumen-*.css'
      - 'script.js'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'qa/qa-master.mjs'
      - '.github/workflows/lumen-master-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      QA_BASE_URL: ${{ github.ref_name == 'release/lumen-master-v1.0' && 'https://lumen.destaquelocal.com.br/' || 'https://vagnerpacheco89.github.io/destaque-local-lumen/' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run deployed-site QA
        run: node qa/qa-master.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-master-qa
          path: qa-artifacts/
          if-no-files-found: error

# Trigger post-consolidation QA after Pages deploy of 36d4db823f0ad5fd47d3bee8bed72516181b1cc9.
