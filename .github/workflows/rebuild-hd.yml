name: Rebuild LUMEN HD assets

on:
  push:
    branches: [hd-image-fix]
    paths:
      - '.github/workflows/rebuild-hd.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: hd-image-fix

      - name: Fetch transferred HD package chunks
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/vagnerpacheco89/destaque-local-lumen/asset-hd-transfer/transfer2'
          mkdir -p /tmp/lumen-transfer
          for f in c000 c001 c002 c003 c004 c005 c006; do
            curl -L --fail --silent --show-error "$base/$f" -o "/tmp/lumen-transfer/$f"
            echo "$f $(stat -c%s /tmp/lumen-transfer/$f) bytes"
          done
          cat /tmp/lumen-transfer/c000 /tmp/lumen-transfer/c001 /tmp/lumen-transfer/c002 /tmp/lumen-transfer/c003 /tmp/lumen-transfer/c004 /tmp/lumen-transfer/c005 /tmp/lumen-transfer/c006 > /tmp/lumen_q45.zip.b64
          base64 -d /tmp/lumen_q45.zip.b64 > /tmp/lumen_q45.zip
          echo '599523a6c0f0af848baa2a5c257513d0c75486619f0a3876859ee243315b2f41  /tmp/lumen_q45.zip' | sha256sum -c -

      - name: Extract and validate assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lumen_hd
          mkdir -p /tmp/lumen_hd assets/hd
          unzip -q /tmp/lumen_q45.zip -d /tmp/lumen_hd
          echo '--- extracted files ---'
          find /tmp/lumen_hd -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          test "$(find /tmp/lumen_hd -maxdepth 1 -type f -name '*.avif' | wc -l)" -eq 14
          cp /tmp/lumen_hd/*.avif assets/hd/
          test "$(find assets/hd -maxdepth 1 -type f -name '*.avif' | wc -l)" -eq 14

      - name: Commit reconstructed HD assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/hd
          if git diff --cached --quiet; then
            echo 'No HD asset changes to commit.'
          else
            git commit -m 'build: reconstruct verified HD image assets'
            git push origin HEAD:hd-image-fix
          fi
