name: Drive probe

on:
  push:
    branches: [asset-hd-transfer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe one Drive image with gdown
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --quiet gdown
          gdown 'https://drive.google.com/uc?id=1L4b4-XyLTN8422XHDhSjbiA3GmoVJsZx' -O /tmp/probe.png
          wc -c /tmp/probe.png
          file /tmp/probe.png
          head -c 16 /tmp/probe.png | xxd
          test "$(wc -c < /tmp/probe.png)" -gt 1000000
          file /tmp/probe.png | grep -qi 'PNG image data'
