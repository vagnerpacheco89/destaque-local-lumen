name: Probe Drive asset

on:
  push:
    branches: [asset-hd-transfer]
    paths:
      - '.github/workflows/drive-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download original Drive image without auth
        shell: bash
        run: |
          set -euo pipefail
          url='https://drive.google.com/uc?export=download&id=1L4b4-XyLTN8422XHDhSjbiA3GmoVJsZx'
          curl -L --fail --silent --show-error "$url" -o /tmp/original.png
          echo "bytes=$(stat -c%s /tmp/original.png)"
          file /tmp/original.png
          sha256sum /tmp/original.png
          xxd -l 16 /tmp/original.png
          test "$(stat -c%s /tmp/original.png)" -gt 1000000
          file /tmp/original.png | grep -q 'PNG image data'
