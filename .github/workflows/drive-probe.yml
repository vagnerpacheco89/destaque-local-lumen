name: Drive probe

on:
  push:
    branches: [asset-hd-transfer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Drive image endpoints
        shell: bash
        run: |
          set +e
          id='1L4b4-XyLTN8422XHDhSjbiA3GmoVJsZx'
          urls=(
            "https://drive.google.com/thumbnail?id=$id&sz=w2000"
            "https://lh3.googleusercontent.com/d/$id=w2000"
            "https://drive.google.com/uc?export=view&id=$id"
            "https://drive.google.com/uc?export=download&id=$id"
            "https://drive.usercontent.google.com/download?id=$id&export=download"
          )
          i=0
          for url in "${urls[@]}"; do
            out="/tmp/p$i"
            echo "=== $i $url"
            curl -L -sS --max-time 20 -o "$out" -w 'HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download}\n' "$url"
            file "$out"
            head -c 16 "$out" | xxd
            i=$((i+1))
          done
