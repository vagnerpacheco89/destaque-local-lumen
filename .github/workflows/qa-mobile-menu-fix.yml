name: LUMEN mobile menu QA fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-mobile-menu-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Improve mobile menu keyboard state
        shell: bash
        env:
          OLD_B64: 
          NEW_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('script-base.js')
          text = p.read_text()
          old = base64.b64decode(os.environ['OLD_B64']).decode()
          new = base64.b64decode(os.environ['NEW_B64']).decode()
          if old not in text:
              raise SystemExit('Expected mobile-menu block not found')
          p.write_text(text.replace(old, new, 1))
          p = Path('script.js')
          text = p.read_text()
          old_version = "const VERSION = '20260914-qa-01';"
          new_version = "const VERSION = '20260914-qa-02';"
          if old_version not in text:
              raise SystemExit('Expected script VERSION marker not found')
          p.write_text(text.replace(old_version, new_version, 1))
          p = Path('index.html')
          text = p.read_text()
          old_src = '<script src="script.js?v=20260914-qa-01"></script>'
          new_src = '<script src="script.js?v=20260914-qa-02"></script>'
          if old_src not in text:
              raise SystemExit('Expected index script marker not found')
          p.write_text(text.replace(old_src, new_src, 1))
          PY
          rm -f .github/workflows/qa-mobile-menu-fix.yml

      - name: Commit QA fix and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script-base.js script.js index.html .github/workflows/qa-mobile-menu-fix.yml
          git commit -m "fix: improve mobile menu keyboard behavior"
          git push origin HEAD:main
