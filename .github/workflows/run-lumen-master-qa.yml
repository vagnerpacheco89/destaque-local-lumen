name: Run LUMEN MASTER QA now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-lumen-master-qa.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Patch QA harness for visible CTA selection
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('qa/qa-master.mjs')
          text = p.read_text()
          old = "await page.locator('[data-demo-cta]').first().click();"
          new = "await page.locator('[data-demo-cta]:visible').first().click();"
          if old not in text:
              raise SystemExit('CTA harness marker not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Run real-deploy QA
        run: node qa/qa-master.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-master-qa
          path: qa-artifacts/
          if-no-files-found: error
