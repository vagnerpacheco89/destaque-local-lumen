name: Restructure LUMEN footer

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/restructure-footer.yml'

permissions:
  contents: write

jobs:
  update-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply footer structure
        run: python tools/restructure_footer.py

      - name: Commit footer structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No footer changes"
            exit 0
          fi
          git commit -m "feat: expand footer with social and demo contact details"
          git push origin HEAD:main
