name: LUMEN cache-bust QA fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-cache-bust.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Refresh cache versions without changing frozen UI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          replacements = {
              'href="styles.css"': 'href="styles.css?v=20260914-qa-01"',
              'href="lumen-polish.css?v=20260907-hero-02"': 'href="lumen-polish.css?v=20260914-qa-01"',
              '<script src="script.js"></script>': '<script src="script.js?v=20260914-qa-01"></script>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected index marker not found: {old}')
              text = text.replace(old, new, 1)
          index.write_text(text)

          script = Path('script.js')
          js = script.read_text()
          old = "const VERSION = '20260910-area-map-01';"
          new = "const VERSION = '20260914-qa-01';"
          if old not in js:
              raise SystemExit('Expected script VERSION marker not found')
          script.write_text(js.replace(old, new, 1))
          PY

          rm -f .github/workflows/qa-cache-bust.yml

      - name: Commit QA fix and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js .github/workflows/qa-cache-bust.yml
          git commit -m "fix: refresh LUMEN cache versions"
          git push origin HEAD:main
